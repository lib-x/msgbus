[workspace]
members = [
    "crates/msgbus-core",
    "crates/msgbus-proto",
    "crates/msgbus-server",
    "crates/msgbus-sdk-rust",
    "crates/msgbus-store-redb",
    "crates/msgbus-store-sqlite",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/msgbus"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.11.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures-core = "0.3.31"
prost = "0.14.3"
redb = "4.1.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "warn"
